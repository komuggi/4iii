<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>台本_ト書きあり</title>
<style>
@page { size: A4 landscape; margin: 20mm; @bottom-center { content: counter(page); font-size: 9pt; writing-mode: horizontal-tb; } }
html {
  writing-mode: vertical-rl;
  font-family: "BIZ UDPMincho", "BIZ UDP明朝 Medium", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  font-size: 12pt;
  line-height: 1.8;
}
body { margin: 0; }
p { margin: 0; }
h1 { font-size: 1.6em; margin-block: 0 1em; }
h2 { font-size: 1.25em; margin-block: 1em; }
.new-page { break-before: page; }
.new-page + .new-page, body > .new-page:first-child { break-before: auto; }
.gap { block-size: 0; margin-block-end: 1em; }
.serifu { padding-inline-start: 3em; }
.t-指示 { font-size: 0.9em; color: #555; }
.speaker { font-weight: bold; }
.tcy { text-combine-upright: all; }
.count-list { margin-block: 1em; }
.count-total { font-weight: bold; }

</style>
</head>
<body>
<h2 class="new-page">Track <span class="tcy">01</span> : <span class="tcy">30</span>文字</h2>
<p class="t-指示">// ↓前</p>
<p class="serifu">あいうえお…、。</p>
<p class="t-指示">// ▶前</p>
<p class="t-範囲">↓行の頭</p>
<p class="t-範囲">▶行の頭</p>
<p class="t-場面">(&lt;&lt;場面の中は範囲にならない)</p>
<p class="serifu">▼ふつうの文字</p>
<p class="t-指示">// ↓もう一つ</p>
<p class="t-指示">// ▶もう一つ</p>
</body>
</html>
